name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Never run two deploys of the same ref at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy Worker
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build (wrangler --dry-run)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run

      # Creates the D1 database if it doesn't exist yet (no-op otherwise) and
      # patches the binding ids into wrangler.toml for this run only.
      - name: Ensure D1 database
        run: node scripts/ensure-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Worker secrets pushed on each deploy, sourced from repo secrets
          # (name on its own line, value on the next).
          secrets: |
            ADMIN_SECRET
            ${{ secrets.ADMIN_SECRET }}
            CF_ACCOUNT_ID
            ${{ secrets.CF_ACCOUNT_ID }}
            CF_API_TOKEN
            ${{ secrets.CF_API_TOKEN }}
