# Cloudflare Worker configuration for nexus.
#
# Deployed via GitHub Actions (.github/workflows/deploy.yml).
# Worker secrets (ADMIN_SECRET, CF_ACCOUNT_ID, CF_API_TOKEN) are pushed from
# GitHub Actions secrets by that workflow — do NOT put them in [vars] here.

name = "nexus"
main = "src/index.js"
compatibility_date = "2026-10-16"

[observability]
enabled = true

# D1 database binding (env.DB).
# The placeholders below are intentional: the deploy workflow runs
# scripts/ensure-d1.mjs, which creates the database (default name "nexus-db",
# override with D1_DATABASE_NAME) if it doesn't exist and fills in the real
# name/id for that run. Set real values here to skip auto-provisioning.
[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_D1_NAME"
database_id = "REPLACE_WITH_D1_ID"

# Analytics Engine binding (env.ANALYTICS) is DISABLED: the account does not
# have Analytics Engine enabled, and a binding to it makes deploys fail
# (Cloudflare error 10089). To re-enable, turn on Analytics Engine in the
# dashboard, uncomment the block below, and set ANALYTICS_DIAG = true in
# src/config/flags.js. Dataset name must match AE_DATASET in that file.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "nexus_logs"

# Proxy-pool health checker (scheduled()). Every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]
